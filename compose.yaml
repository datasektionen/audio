services:
  audio:
    build: .
    environment:
      - DATABASE_URL=postgresql://audio:audio@db:5432/audio
      - ROCKET_PORT=8080
    ports: [ 8080:8080 ]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=audio
      - POSTGRES_PASSWORD=audio
    healthcheck:
      test:
        - "CMD-SHELL"
        - "sh -c 'pg_isready -d postgres -U audio'"
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 10s
